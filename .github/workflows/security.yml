name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      # The audited set is the one the test suite installs, resolved from the lock so the
      # audit reads the versions that ship in CI rather than a fresh resolution.
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra test --extra data

      # Both ignored advisories are torch, and neither can be closed by a lockfile change.
      # PYSEC-2026-139 has no fixed version published in any release. PYSEC-2025-194 is
      # fixed in 2.13.0, above the deliberate <2.11 ceiling pyproject.toml declares three
      # times, because 2.11 wheels link against libcudart.so.13 and would move the whole
      # stack to CUDA 13. Reviewed 2026-09-08. Revisit when the CUDA 12 ceiling is lifted,
      # or when PYSEC-2026-139 publishes a fix.
      - name: Pip audit
        run: >-
          uv run pip-audit --desc
          --ignore-vuln PYSEC-2026-139
          --ignore-vuln PYSEC-2025-194

      - name: Bandit
        run: uv run bandit -r src/datarax/ -c pyproject.toml -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
