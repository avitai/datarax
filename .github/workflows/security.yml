name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      # pip-audit and bandit come from the dev extra; the audit itself reads the lockfile.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Every extra the lock resolves, in groups that respect [tool.uv] conflicts, each
      # audited with a fresh advisory cache. The ignored advisories and their reasons live
      # in the script, which also fails on an ignore that no longer matches anything.
      - name: Audit the locked dependencies
        run: uv run python scripts/audit_lock.py

      - name: Bandit
        run: uv run bandit -r src/datarax/ -c pyproject.toml -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
