name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      # Bandit comes from the dev extra.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Every extra the lock resolves, in groups that respect [tool.uv] conflicts, each
      # audited by a pinned pip-audit with a fresh advisory cache. The ignored advisories and
      # their reasons live in [tool.substrax.audit-lock.ignore] in pyproject.toml; the action
      # also fails on an ignore that no longer matches anything.
      - name: Audit the locked dependencies
        uses: avitai/substrax/.github/actions/audit-lock@13e98b78127606be04437bd7c5de894fb765a28e

      - name: Bandit
        run: uv run bandit -r src/datarax/ -c pyproject.toml -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
