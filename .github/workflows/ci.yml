name: Datarax CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  already_tested:
    name: Tree already tested
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.compare.outputs.skip }}

    steps:
      - uses: actions/checkout@v4

      # A merge repeats the pull request; a schedule re-measures the tree against dependencies that
      # have moved, and a manual run is asked for. When this step does not run the output is empty,
      # which every consumer reads as "test it". The compare lives in substrax, the stack's base
      # layer: skip only when this tree is the pull request's and every check of it succeeded.
      - name: Compare this tree with the pull request that produced it
        id: compare
        if: github.event_name == 'push'
        uses: avitai/substrax/.github/actions/already-tested@ec43d80bbae0040375f746cd1bb07dddb0a0b169

  # Not gated on already_tested: performance_tests runs only on main, so it never
  # repeats a pull request, and a skipped dependency would take it down with it.
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true
          cache-suffix: "lint"

      - name: Lock file is current
        run: uv lock --check

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install dependencies
        run: |
          # The extras setup.sh installs for every developer: pyright checks the tree against
          # this environment, and a source module imports datasets from the data extra.
          uv sync --locked --extra dev --extra test --extra data

      - name: Setup PYTHONPATH for tests
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Run pre-commit (lint, types, complexity, dead-code gates)
        env:
          PRE_COMMIT_HOME: /tmp/pre-commit-cache
          UV_CACHE_DIR: /tmp/uv-cache
        run: |
          uv run pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Documented benchmark coverage matches the tree
        run: uv run python scripts/derive_status.py --check

  examples:
    name: Validate Examples
    needs: [lint, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true
          cache-suffix: "examples"

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --extra docs

      - name: Validate example structure
        run: |
          uv run python scripts/validate_examples.py

      - name: Check notebook synchronization
        run: |
          uv run python scripts/check_sync.py

      - name: Run example structure tests
        run: |
          export JAX_PLATFORMS="cpu"
          # Disable coverage for examples tests (they only check structure, not code)
          uv run pytest tests/examples/ -v -m "not slow and not tfds" --no-cov

  unit_tests:
    name: Unit Tests (Python ${{ matrix.python-version }}, shard ${{ matrix.group }})
    needs: [lint, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    # macOS runs nightly and before a release, in macos.yml.
    runs-on: ubuntu-latest
    # pytest-split divides one collection into this many groups, one per matrix leg; the
    # group list below is 1..UNIT_TEST_SHARDS. With no durations file it balances by test
    # count (least_duration gives every test the same weight). Unsharded, the suite took
    # about 32 minutes; four shards bring each leg well under the long-running job, which
    # the coverage job waits on as well, so more shards would not shorten the run.
    env:
      UNIT_TEST_SHARDS: 4
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
        group: [1, 2, 3, 4]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true
          cache-suffix: "unit-${{ matrix.python-version }}"

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --extra test --extra data --extra wandb

      - name: Setup PYTHONPATH for tests
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV


      - name: Run unit tests
        run: |
          # Explicitly run on CPU for GitHub workflow
          export JAX_PLATFORMS="cpu"
          # pytest-randomly orders the collection before pytest-split assigns it, so every
          # shard of a run takes the run's id as its seed: one order, each test in exactly one
          # shard. docs/contributing/testing_guide.md shows how to rerun one shard locally.
          uv run pytest tests benchmarks/tests --no-integration --no-end-to-end --no-benchmark -v -m "not slow and not tfds" --cov-fail-under=0 \
            --splits "$UNIT_TEST_SHARDS" --group ${{ matrix.group }} --splitting-algorithm least_duration \
            --randomly-seed=${{ github.run_id }}

      - name: Prepare coverage data
        run: uv run coverage combine || true
        if: always()

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-py${{ matrix.python-version }}-shard${{ matrix.group }}
          path: .coverage
          include-hidden-files: true
        if: always()

  # Not gated on already_tested: a pull request run restores only its own ref's caches and
  # main's, so every push to main keeps the prepared datasets there. On a hit this is seconds.
  prepare_example_datasets:
    name: Prepare Example Datasets
    needs: lint
    runs-on: ubuntu-latest
    # CIFAR-10 comes from a host that sends each connection about 100 KB/s. The script fetches it
    # over eight ranged connections in its own job and budget instead of an example's.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Restore or save the example dataset cache
        id: datasets
        uses: actions/cache@v4
        with:
          path: |
            ~/tensorflow_datasets
            ~/.keras/datasets
          key: example-datasets-array_record-${{ hashFiles('scripts/prepare_example_datasets.py') }}

      - name: Set up Python
        if: steps.datasets.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        if: steps.datasets.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true
          cache-suffix: "long-running"

      - name: Install dependencies
        if: steps.datasets.outputs.cache-hit != 'true'
        run: |
          uv venv
          uv sync --locked --extra dev --extra test --extra data --extra tfds --extra examples

      - name: Download and prepare the datasets
        if: steps.datasets.outputs.cache-hit != 'true'
        run: uv run python scripts/prepare_example_datasets.py

      # A cache save can fail ("Unable to reserve cache"), and then nothing would reach the
      # example tier; this run's artifact carries the datasets to it whatever the save did.
      - name: Hand the prepared datasets to this run
        if: steps.datasets.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: example-datasets
          path: |
            ~/tensorflow_datasets
            ~/.keras/datasets
          include-hidden-files: true
          retention-days: 1

  long_running_tests:
    name: Long-Running Tests
    # The longest job in the run, and the one the coverage job waits on. Its only input
    # is the dataset cache prepare_example_datasets fills, so it runs beside the unit
    # matrix rather than after it.
    needs: [prepare_example_datasets, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true
          cache-suffix: "long-running"

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install dependencies
        run: |
          # tfds carries tensorflow and examples carries keras. This job is the only one
          # that EXECUTES the example scripts (tests/examples' executing test is marked
          # slow), and several of them import both. The data extra declares
          # tensorflow-datasets without tensorflow, so the scripts died with
          # ModuleNotFoundError. The job had been skipped behind a failing lint gate, so
          # nothing reported it.
          uv sync --locked --extra dev --extra test --extra data --extra tfds --extra examples --extra wandb

      - name: Setup PYTHONPATH for tests
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV


      - name: Restore the prepared example datasets
        id: datasets
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/tensorflow_datasets
            ~/.keras/datasets
          key: example-datasets-array_record-${{ hashFiles('scripts/prepare_example_datasets.py') }}

      # Present whenever prepare_example_datasets missed the cache; absent otherwise, and then
      # this step fails rather than letting an example download the datasets.
      - name: Take the datasets this run prepared
        if: steps.datasets.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: example-datasets
          path: ~/

      # The TFDS tests read an offline dataset whose preparation imports TensorFlow, which only
      # this job installs. It is prepared here, before them, and named for them; a missing
      # fixture fails those tests rather than skipping them.
      - name: Prepare the TFDS test fixture
        run: |
          uv run python -m tests.test_common.tfds_fixture "$RUNNER_TEMP/tfds_fixture"
          echo "DATARAX_TFDS_FIXTURE_DIR=$RUNNER_TEMP/tfds_fixture" >> "$GITHUB_ENV"

      - name: Run long-running tests
        run: |
          # Each example has a 300 s budget, and running past it fails the test.
          # Slow-host datasets come from what prepare_example_datasets prepared,
          # so no example downloads them inside its budget. The TFDS tests run only here.
          export JAX_PLATFORMS="cpu"
          export DATARAX_EXAMPLE_TIMEOUT_SECONDS=300
          uv run pytest tests benchmarks/tests -m "slow or tfds" --no-benchmark -v --cov-fail-under=0 --timeout=600 --durations=0

      - name: Prepare coverage data
        run: uv run coverage combine || true
        if: always()

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-long-running
          path: .coverage
          include-hidden-files: true
        if: always()

  integration_tests:
    name: Integration Tests
    needs: [lint, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true
          cache-suffix: "integration"

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --extra test --extra data --extra wandb

      - name: Setup PYTHONPATH for tests
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV


      - name: Run integration tests
        run: |
          # Explicitly run on CPU for GitHub workflow
          export JAX_PLATFORMS="cpu"
          uv run pytest tests --integration -v -m "not tfds" --cov-fail-under=0

      - name: Prepare coverage data
        run: uv run coverage combine || true
        if: always()

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: .coverage
          include-hidden-files: true
        if: always()

  end_to_end_tests:
    name: End-to-End Tests
    needs: [lint, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true
          cache-suffix: "e2e"

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --extra test --extra data

      - name: Setup PYTHONPATH for tests
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Run end-to-end tests
        run: |
          # Explicitly run on CPU for GitHub workflow
          export JAX_PLATFORMS="cpu"
          uv run pytest \
            tests/pipeline/test_pipeline_integration.py \
            tests/pipeline/test_pipeline_scan.py \
            tests/pipeline/test_pipeline_dag.py \
            -v -m "not tfds" --cov-fail-under=0

      - name: Prepare coverage data
        run: uv run coverage combine || true
        if: always()

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e
          path: .coverage
          include-hidden-files: true
        if: always()

  performance_tests:
    name: Performance Tests
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true
          cache-suffix: "perf"

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --extra test --extra data --extra wandb

      - name: Setup PYTHONPATH for tests
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV


      - name: Run performance tests
        run: |
          # Explicitly run on CPU for GitHub workflow
          # Disable coverage to avoid distorting benchmark timings
          export JAX_PLATFORMS="cpu"
          uv run pytest tests --benchmark -v -m "not tfds" --no-cov --benchmark-autosave --benchmark-columns=mean,stddev,min,max

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results/
            benchmark.json
            histogram.svg

  coverage:
    name: Test Coverage
    needs: [unit_tests, long_running_tests, integration_tests, end_to_end_tests, already_tested]
    if: needs.already_tested.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-line coverage gate diffs against origin/main.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true
          cache-suffix: "coverage"

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --extra test

      - name: Download all coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: artifacts

      - name: List downloaded coverage files
        run: find artifacts -type f | sort

      - name: Combine coverage reports
        run: |
          # Collect all .coverage files from artifact subdirectories
          i=0
          for f in $(find artifacts -name ".coverage" -type f); do
            cp "$f" ".coverage.$i"
            i=$((i + 1))
          done

          if [ "$i" -eq 0 ]; then
            echo "::error::No coverage data found from test jobs; the floor cannot be checked"
            exit 1
          fi

          echo "Found $i coverage file(s), combining..."
          uv run coverage combine
          uv run coverage report
          uv run coverage xml

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage-report
          path: coverage.xml
        if: always()

      # The package-wide floor lets a pull request add an untested module; this gates the lines
      # the pull request changes, from the coverage every test job measured.
      - name: Coverage on changed lines (at least 80%)
        if: github.event_name == 'pull_request'
        run: uv run --no-sync diff-cover coverage.xml --compare-branch=origin/main --fail-under=80 --show-uncovered
