name: Datarax CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-suffix: "lint"

      - name: Lock file is current
        run: uv lock --check

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install dependencies
        run: |
          # The extras setup.sh installs for every developer: pyright checks the tree against
          # this environment, and a source module imports datasets from the data extra.
          uv sync --locked --extra dev --extra test --extra data

      - name: Setup PYTHONPATH for tests
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Run pre-commit (lint, types, complexity, dead-code gates)
        env:
          PRE_COMMIT_HOME: /tmp/pre-commit-cache
          UV_CACHE_DIR: /tmp/uv-cache
        run: |
          uv run pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Documented benchmark coverage matches the tree
        run: uv run python scripts/derive_status.py --check

  examples:
    name: Validate Examples
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-suffix: "examples"

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --extra docs

      - name: Validate example structure
        run: |
          uv run python scripts/validate_examples.py

      - name: Check notebook synchronization
        run: |
          uv run python scripts/check_sync.py

      - name: Run example structure tests
        run: |
          export JAX_PLATFORMS="cpu"
          # Disable coverage for examples tests (they only check structure, not code)
          uv run pytest tests/examples/ -v -m "not slow" --no-cov

  unit_tests:
    name: Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The macOS-14 runners queue for hours and run the same steps; they run on
        # pushes to main only, so a branch or pull request is gated by the ubuntu
        # jobs alone and the merge to main measures both platforms.
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest", "macos-14"]' || '["ubuntu-latest"]') }}
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-suffix: "unit-${{ matrix.python-version }}-${{ matrix.os }}"

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          uv sync --locked --extra dev --extra test --extra data --extra wandb

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          uv sync --locked --extra dev --extra test --extra data --extra wandb

      - name: Setup PYTHONPATH for tests
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - uses: ./.github/actions/format2-iterator-fixture

      - name: Run unit tests
        run: |
          # Explicitly run on CPU for GitHub workflow
          export JAX_PLATFORMS="cpu"
          # Note: TFDS tests are skipped on macOS due to TensorFlow ARM64 import hang issue
          # (https://github.com/tensorflow/tensorflow/issues/52138)
          # This matches the approach of major ML projects (Keras, Flax) which don't test on macOS
          uv run pytest tests benchmarks/tests --no-integration --no-end-to-end -v -m "not slow" --cov-fail-under=0

      - name: Prepare coverage data
        run: uv run coverage combine || true
        if: always()

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .coverage
          include-hidden-files: true
        if: always()

  prepare_example_datasets:
    name: Prepare Example Datasets
    needs: lint
    runs-on: ubuntu-latest
    # CIFAR-10 comes from a host that sends each connection about 100 KB/s. The script fetches it
    # over eight ranged connections in its own job and budget instead of an example's.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Restore or save the example dataset cache
        id: datasets
        uses: actions/cache@v4
        with:
          path: |
            ~/tensorflow_datasets
            ~/.keras/datasets
          key: example-datasets-${{ hashFiles('scripts/prepare_example_datasets.py') }}

      - name: Set up Python
        if: steps.datasets.outputs.cache-hit != 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        if: steps.datasets.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-suffix: "long-running"

      - name: Install dependencies
        if: steps.datasets.outputs.cache-hit != 'true'
        run: |
          uv venv
          uv sync --locked --extra dev --extra test --extra data --extra tfds --extra examples

      - name: Download and prepare the datasets
        if: steps.datasets.outputs.cache-hit != 'true'
        run: uv run python scripts/prepare_example_datasets.py

  long_running_tests:
    name: Long-Running Tests
    # The longest job in the run, and the one the coverage job waits on. Its only input
    # is the dataset cache prepare_example_datasets fills, so it runs beside the unit
    # matrix rather than after it.
    needs: prepare_example_datasets
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-suffix: "long-running"

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install dependencies
        run: |
          # tfds carries tensorflow and examples carries keras. This job is the only one
          # that EXECUTES the example scripts (tests/examples' executing test is marked
          # slow), and several of them import both. The data extra declares
          # tensorflow-datasets without tensorflow, so the scripts died with
          # ModuleNotFoundError. The job had been skipped behind a failing lint gate, so
          # nothing reported it.
          uv sync --locked --extra dev --extra test --extra data --extra tfds --extra examples --extra wandb

      - name: Setup PYTHONPATH for tests
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - uses: ./.github/actions/format2-iterator-fixture

      - name: Restore the prepared example datasets
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/tensorflow_datasets
            ~/.keras/datasets
          key: example-datasets-${{ hashFiles('scripts/prepare_example_datasets.py') }}
          fail-on-cache-miss: true

      - name: Run long-running tests
        run: |
          # Each example has a 300 s budget, and running past it fails the test.
          # Slow-host datasets come from the cache prepare_example_datasets fills,
          # so no example downloads them inside its budget.
          export JAX_PLATFORMS="cpu"
          export DATARAX_EXAMPLE_TIMEOUT_SECONDS=300
          uv run pytest tests benchmarks/tests -m slow -v --cov-fail-under=0 --timeout=600 --durations=0

      - name: Prepare coverage data
        run: uv run coverage combine || true
        if: always()

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-long-running
          path: .coverage
          include-hidden-files: true
        if: always()

  integration_tests:
    name: Integration Tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-suffix: "integration"

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --extra test --extra data --extra wandb

      - name: Setup PYTHONPATH for tests
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - uses: ./.github/actions/format2-iterator-fixture

      - name: Run integration tests
        run: |
          # Explicitly run on CPU for GitHub workflow
          export JAX_PLATFORMS="cpu"
          uv run pytest tests --integration -v --cov-fail-under=0

      - name: Prepare coverage data
        run: uv run coverage combine || true
        if: always()

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: .coverage
          include-hidden-files: true
        if: always()

  end_to_end_tests:
    name: End-to-End Tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-suffix: "e2e"

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --extra test --extra data

      - name: Setup PYTHONPATH for tests
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Run end-to-end tests
        run: |
          # Explicitly run on CPU for GitHub workflow
          export JAX_PLATFORMS="cpu"
          uv run pytest \
            tests/pipeline/test_pipeline_integration.py \
            tests/pipeline/test_pipeline_scan.py \
            tests/pipeline/test_pipeline_dag.py \
            -v --cov-fail-under=0

      - name: Prepare coverage data
        run: uv run coverage combine || true
        if: always()

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e
          path: .coverage
          include-hidden-files: true
        if: always()

  performance_tests:
    name: Performance Tests
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-suffix: "perf"

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --extra test --extra data --extra wandb

      - name: Setup PYTHONPATH for tests
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - uses: ./.github/actions/format2-iterator-fixture

      - name: Run performance tests
        run: |
          # Explicitly run on CPU for GitHub workflow
          # Disable coverage to avoid distorting benchmark timings
          export JAX_PLATFORMS="cpu"
          uv run pytest tests --benchmark -v --no-cov --benchmark-autosave --benchmark-columns=mean,stddev,min,max

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results/
            benchmark.json
            histogram.svg

  coverage:
    name: Test Coverage
    needs: [unit_tests, long_running_tests, integration_tests, end_to_end_tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-suffix: "coverage"

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --extra test

      - name: Download all coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: artifacts

      - name: List downloaded coverage files
        run: find artifacts -type f | sort

      - name: Combine coverage reports
        run: |
          # Collect all .coverage files from artifact subdirectories
          i=0
          for f in $(find artifacts -name ".coverage" -type f); do
            cp "$f" ".coverage.$i"
            i=$((i + 1))
          done

          if [ "$i" -eq 0 ]; then
            echo "::error::No coverage data found from test jobs; the floor cannot be checked"
            exit 1
          fi

          echo "Found $i coverage file(s), combining..."
          uv run coverage combine
          uv run coverage report
          uv run coverage xml

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage-report
          path: coverage.xml
        if: always()
