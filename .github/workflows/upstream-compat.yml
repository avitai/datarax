# Runs the fast test subset against the newest Grain and Orbax releases, ahead of the
# lock. A failure here is a heads-up that the next `uv lock --upgrade` will need work,
# not a gate on merges: nothing depends on this job.
name: Upstream Compatibility

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-grain-orbax:
    name: Latest grain and orbax-checkpoint (shard ${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The fast subset is about 7,100 tests: one job took 47 minutes on one runner and passed its
    # 60-minute limit on a 28% slower one. It is split as ci.yml splits it (pytest-split, the
    # run's id as every shard's seed, so each test runs in exactly one shard).
    env:
      JAX_PLATFORMS: cpu
      UNIT_TEST_SHARDS: 4
    strategy:
      matrix:
        group: [1, 2, 3, 4]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true
          cache-suffix: "upstream-compat"

      - name: Install the locked environment
        run: |
          uv venv
          uv sync --locked --extra dev --extra test --extra data --extra wandb

      # The upgrade resolves the project's requirements with those extras, so newer grain and
      # orbax-checkpoint bring only releases every installed package admits; `uv pip install
      # --upgrade <name>` alone does not hold the installed packages' bounds. `uv pip check`
      # names any conflict left. Every later step calls the environment's own binaries,
      # because `uv run` would re-sync to the lock and undo the upgrade.
      - name: Upgrade grain and orbax-checkpoint to their newest releases
        run: |
          uv pip install -e ".[dev,test,data,wandb]" --upgrade-package grain --upgrade-package orbax-checkpoint
          uv pip check
          .venv/bin/python -c "import flax, grain, jax, orbax.checkpoint as ocp, google.protobuf as pb; print('grain', grain.__version__, 'orbax-checkpoint', ocp.__version__, 'jax', jax.__version__, 'flax', flax.__version__, 'protobuf', pb.__version__)"

      # A GITHUB_ENV write reaches later steps only, so the path is set in a step of its own, as
      # in ci.yml; the tests' child processes import tests.test_common through it.
      - name: Setup PYTHONPATH for tests
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> "$GITHUB_ENV"

      - name: Run the fast test subset
        run: |
          .venv/bin/pytest tests --no-integration --no-end-to-end --no-benchmark -rs -m "not slow and not tfds" --no-cov -p no:cacheprovider \
            --splits "$UNIT_TEST_SHARDS" --group ${{ matrix.group }} --splitting-algorithm least_duration \
            --randomly-seed=${{ github.run_id }}
