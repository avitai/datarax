name: Datarax Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # macos.yml builds on macOS through this workflow.
  workflow_call:
    inputs:
      os:
        description: The runner to build on.
        type: string
        default: ubuntu-latest

concurrency:
  # Called from macos.yml, github.workflow names the caller; the suffix keeps this group apart
  # from the caller's own, which would otherwise cancel the call as a deadlock.
  group: ${{ github.workflow }}-build-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package Build Verification (${{ inputs.os || 'ubuntu-latest' }}, Python ${{ matrix.python-version }})
    # A push or pull request builds on ubuntu; macos.yml passes macos-14 nightly and before a
    # release.
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    strategy:
      # At most two runners at a time, so a macOS build leaves the other repositories' jobs room.
      max-parallel: 2
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          prune-cache: true
          enable-cache: true
          cache-suffix: "${{ inputs.os || 'ubuntu-latest' }}-${{ matrix.python-version }}"

      - name: Create virtual environment
        run: |
          uv venv

      - name: Install build dependencies
        run: |
          uv sync --locked --extra dev --extra data
          # Install type stubs for common libraries
          uv pip install types-requests types-setuptools

      - name: Setup PYTHONPATH for tests
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Clean old build artifacts
        run: |
          rm -rf dist build *.egg-info

      - name: Build package
        run: |
          uv run python -m build

      - name: Verify package
        run: |
          uv run twine check --strict dist/*

      - name: Test installation in clean environment
        run: |
          # Create a temporary virtual environment
          uv venv test_venv
          # Activate the virtual environment and install the wheel
          . test_venv/bin/activate
          uv pip install dist/*.whl

          # Verify the package can be imported
          python -c "import datarax; print(f'Successfully imported datarax version {datarax.__version__}')"
          deactivate

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts-${{ inputs.os || 'ubuntu-latest' }}-py${{ matrix.python-version }}
          path: dist/
