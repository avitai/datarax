name: Performance Gate

on:
  pull_request:
    paths:
      - 'src/datarax/**'
      - 'benchmarks/**'
      - 'pyproject.toml'

jobs:
  benchmark-tier1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XLA_FLAGS: "--xla_force_host_platform_device_count=4"
      JAX_PLATFORMS: "cpu"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        # automation is excluded rather than skipped by accident. It is declared as
        # conflicting with every other extra so its exact pins stop governing the
        # universal resolution, which makes --all-extras impossible by definition:
        # uv cannot install a set it has been told is inconsistent. This gate runs
        # benchmarks.runners.ci_runner, which never touches benchmarks/automation.
        run: uv sync --all-extras --no-extra automation

      - name: Install calibrax
        run: uv pip install "calibrax @ git+https://github.com/avitai/calibrax.git"

      - name: Run Tier 1 Benchmark Gate
        run: uv run python -m benchmarks.runners.ci_runner --repetitions 3

      - name: Regression check (calibrax)
        run: uv run calibrax check --data benchmark-data/ --threshold 0.05
        continue-on-error: true  # Non-blocking until baseline is established

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark-data/
          retention-days: 30
